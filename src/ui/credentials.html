<!doctype html>
<html>
  <head>
    <base target="_top" />
    <style>
      body {
        font:
          14px Arial,
          sans-serif;
        padding: 16px;
      }
      label {
        display: block;
        margin-top: 10px;
      }
      input {
        box-sizing: border-box;
        margin-top: 4px;
        padding: 7px;
        width: 100%;
      }
      button {
        margin-top: 16px;
        padding: 8px 12px;
      }
      #status {
        min-height: 20px;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <form id="credentials">
      <label>Client ID<input name="clientId" type="password" autocomplete="off" required /></label>
      <label
        >Client secret<input name="clientSecret" type="password" autocomplete="off" required
      /></label>
      <label>API key<input name="apiKey" type="password" autocomplete="off" required /></label>
      <button id="save" type="submit">Save credentials</button>
      <button id="cancel" type="button">Cancel</button>
      <div id="status" role="status"></div>
    </form>
    <script>
      const form = document.getElementById('credentials');
      const status = document.getElementById('status');
      const save = document.getElementById('save');
      const clear = () => {
        form.reset();
      };
      document.getElementById('cancel').addEventListener('click', () => google.script.host.close());
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        save.disabled = true;
        status.textContent = 'Saving…';
        google.script.run
          .withSuccessHandler(() => {
            clear();
            status.textContent = 'Credentials saved. Use Test connection to verify access.';
            save.disabled = false;
          })
          .withFailureHandler(() => {
            clear();
            status.textContent = 'Credentials were not saved.';
            save.disabled = false;
          })
          .saveCredentials(form);
      });
    </script>
  </body>
</html>
