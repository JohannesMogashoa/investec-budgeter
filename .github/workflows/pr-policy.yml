name: Pull request policy

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  staging-only:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce promotion sources
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$BASE_BRANCH" = "staging" ] && [ "$HEAD_BRANCH" = "development" ] && [ "$HEAD_REPOSITORY" = "$REPOSITORY" ]; then
            echo "Approved promotion path: development -> staging."
            exit 0
          fi
          if [ "$BASE_BRANCH" = "master" ] && [ "$HEAD_BRANCH" = "staging" ] && [ "$HEAD_REPOSITORY" = "$REPOSITORY" ]; then
            echo "Approved promotion path: staging -> master."
            exit 0
          fi
          if [ "$BASE_BRANCH" = "staging" ] || [ "$BASE_BRANCH" = "master" ]; then
            echo "Only development -> staging and staging -> master promotions are allowed."
            exit 1
          fi
          echo "No promotion restriction applies to this target branch."
