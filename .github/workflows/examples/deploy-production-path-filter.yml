# Merge this trigger into the repository's existing production deployment workflow.
# This example intentionally omits deployment jobs/steps.
name: Production Deployment (Path Filter Example)

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'appsscript.json'
      - '.clasp.json'
      - 'clasp*.json'
      - '.github/workflows/deploy-*.yml'

jobs: {}
