name: Quality

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run quality checks
        run: npm run verify
      - name: Upload Apps Script bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apps-script-bundle-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
