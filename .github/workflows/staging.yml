name: Staging Apps Script deployment

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why is this staging deployment being run?
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify before deployment
        run: npm run verify
      - name: Create isolated clasp configuration
        env:
          CLASP_SCRIPT_ID: ${{ secrets.STAGING_SCRIPT_ID }}
        run: |
          node -e "const fs=require('node:fs'); const id=process.env.CLASP_SCRIPT_ID; if (!id) throw new Error('STAGING_SCRIPT_ID is required'); fs.writeFileSync('.clasp.json', JSON.stringify({scriptId:id, rootDir:'dist'}, null, 2)+'\\n');"
      - name: Configure clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          node -e "const fs=require('node:fs'); const value=process.env.CLASPRC_JSON; if (!value) throw new Error('CLASPRC_JSON is required'); JSON.parse(value); fs.writeFileSync(process.env.HOME+'/.clasprc.json', value+'\\n', {mode:0o600});"
      - name: Push bundle to staging Apps Script project
        run: npx --yes @google/clasp@2.4.2 push --force
      - name: Record deployment evidence
        env:
          DEPLOY_REASON: ${{ inputs.reason }}
        run: |
          node scripts/write-deployment-evidence.mjs
      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: staging-deployment-${{ github.sha }}
          path: staging-deployment-evidence.txt
          retention-days: 30
